[project]
name = "populi-api-docs"
version = "0.1.0"
description = "A local, LLM-oriented copy of Populi's API2 reference, refreshed on demand"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[project.scripts]
populi-docs = "populi_docs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/populi_docs"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
