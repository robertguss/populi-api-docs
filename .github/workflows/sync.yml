# Weekly: compare Populi's "documentation updated on" stamp with raw/meta.json.
# If Populi published a new version, fetch it, rebuild reference/, record the
# changes in CHANGES.md, and commit. If not, the run ends after one request.
#
# The populi-api skill also dispatches this workflow when it finds the live
# docs newer than the repo, so a change can land between Mondays.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity. The skill re-enables it before dispatching.

name: Sync Populi docs

on:
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Refetch even if Populi's docs date has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install
        run: uv sync --locked

      - name: Test the parser before trusting it
        run: uv run pytest -q

      - name: Sync
        shell: bash
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run populi-docs sync --commit $FORCE | tee sync.log
          {
            echo '```'
            cat sync.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        run: git push

      - name: Keep the fetched pages when the sanity checks fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rejected-sync
          path: .sync-tmp/raw
          if-no-files-found: ignore
          retention-days: 14
